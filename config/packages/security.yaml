security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # users_in_memory: { memory: null }
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: emailUtil
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: connexion
                check_path: connexion
                default_target_path: accueil
                username_parameter: emailUtil
                password_parameter: motDePasse
                enable_csrf: true
                failure_path: connexion
                # csrf_parameter: _csrf_token
                # csrf_token_id: authenticate
            logout:
                path: deconnexion
                target: connexion

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used

    role_hierarchy:
        ROLE_INSCRIT: ROLE_USER
        ROLE_ADHERENT: ROLE_INSCRIT
        ROLE_BIBLIOTHECAIRE: ROLE_ADHERENT

    access_control:
        # Accès public (utilisateurs non authentifiés)
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/accueil, roles: PUBLIC_ACCESS }
        - { path: ^/contact, roles: PUBLIC_ACCESS }
        - { path: ^/mentions, roles: PUBLIC_ACCESS }
        - { path: ^/documents, roles: PUBLIC_ACCESS }

        # Accès pour utilisateurs authentifiés (ROLE_USER et plus)
        - { path: ^/profil, roles: ROLE_INSCRIT }
        - { path: ^/favoris, roles: ROLE_INSCRIT }

        # Accès pour les adhérents et plus
        - { path: ^/mes-commandes, roles: ROLE_ADHERENT }
        - { path: ^/panier, roles: ROLE_ADHERENT }

        # Accès pour les bibliothécaires et plus
        - { path: ^/admin, roles: ROLE_BIBLIOTHECAIRE }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
